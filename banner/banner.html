<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>誘導バナー｜澤井珈琲 ブック型ギフト2セットで1,000円OFF</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Jost:wght@500;600;700&family=Noto+Sans+JP:wght@700;900&family=Shippori+Mincho+B1:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#1d2c50;--bg2:#121f3d;--gold:#d2b072;--gold-l:#f0dcaa;--red:#a8232e;--paper:#fffaf0;--ink:#1d1a17;
  --min:"Shippori Mincho B1",serif;--sans:"Noto Sans JP",sans-serif;--num:"Jost",sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg2)}
i{font-style:normal}
.bn{position:relative;overflow:hidden;color:#fff;font-family:var(--sans);
  background:radial-gradient(120% 90% at 30% 60%,#24365f,var(--bg) 45%,var(--bg2))}
.bn::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle at 20px 30px,#ffffff70 1px,transparent 1.6px),radial-gradient(circle at 90px 80px,#ffffff45 1px,transparent 1.6px);
  background-size:130px 120px,190px 170px}
.photo{position:absolute;display:block}
.lights{position:absolute;left:0;top:0;width:100%;z-index:3}

/* 期間 */
.lbl{display:inline-block;background:var(--red);color:#fff;font-weight:900;letter-spacing:.14em;line-height:1.5}
.date{display:flex;align-items:center;white-space:nowrap;line-height:1}
.date b{font-family:var(--num);font-weight:600;letter-spacing:-.01em}
.date .w{display:inline-flex;align-items:center;justify-content:center;border-radius:50%;background:var(--gold);color:var(--bg2);font-weight:900}
.date .t{font-family:var(--num);font-weight:500;color:var(--gold-l)}
.date .to{font-family:var(--num);color:var(--gold)}
.ttl{font-family:var(--min);font-weight:800;letter-spacing:.08em;line-height:1.3;white-space:nowrap}
.ttl em{font-style:normal;color:var(--gold-l)}

/* クーポン札 */
.tk{position:relative;background:var(--paper);color:var(--red);text-align:center;border-radius:6px;white-space:nowrap}
.tk::before{content:"";position:absolute;border:1.5px solid var(--gold);border-radius:3px;pointer-events:none}
.tk__pre{font-family:var(--min);font-weight:800;color:var(--ink);letter-spacing:.08em}
.tk__pre b{font-family:var(--num);font-weight:600;color:var(--red)}
.tk__row{display:flex;align-items:center;justify-content:center}
.off{display:inline-flex;align-items:center;line-height:1}
.off>b{font-family:var(--num);font-weight:600;font-size:1em;line-height:.8;letter-spacing:-.02em}
.off__u{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;gap:.04em;margin-left:.05em}
.off__u i{display:block;line-height:.9}
.off__u .y{font-family:var(--sans);font-weight:900;font-size:.5em;line-height:1}
.off__u .o{font-family:var(--num);font-weight:700;font-size:.4em;letter-spacing:.02em}
.tk__c{font-weight:900;letter-spacing:.04em}

/* ===== 1600x900 ===== */
.s900{width:1600px;height:900px}
.s900 .photo{left:0;top:0;width:1060px;height:900px;-webkit-mask:linear-gradient(90deg,#000 70%,transparent);mask:linear-gradient(90deg,#000 70%,transparent)}
.s900 .lights{height:60px}
.s900 .col{position:absolute;left:880px;right:48px;top:56px;bottom:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.s900 .lbl{font-size:40px;padding:6px 30px}
.s900 .date{margin-top:20px;gap:10px}
.s900 .date b{font-size:88px}
.s900 .date .w{width:44px;height:44px;font-size:23px}
.s900 .date .to{font-size:44px;margin:0 2px}
.s900 .times{display:flex;justify-content:space-between;width:100%;max-width:660px;margin-top:10px;padding:0 30px}
.s900 .times span{font-family:var(--num);font-weight:500;font-size:32px;color:var(--gold-l);letter-spacing:.06em}
.s900 .ttl{margin-top:30px;font-size:66px}
.s900 .tk{margin-top:32px;padding:24px 40px 22px}
.s900 .tk::before{inset:11px}
.s900 .tk__pre{font-size:32px}.s900 .tk__pre b{font-size:50px;margin:0 .06em;vertical-align:-.06em}
.s900 .tk__row{margin-top:8px}
.s900 .off{font-size:116px}
.s900 .tk__c{font-size:44px;margin-left:10px}

/* ===== 1600x311 ===== */
.s311{width:1600px;height:311px}
.s311 .photo{left:0;top:0;width:556px;height:311px;-webkit-mask:linear-gradient(90deg,#000 72%,transparent);mask:linear-gradient(90deg,#000 72%,transparent)}
.s311 .lights{height:40px}
.s311 .col{position:absolute;left:500px;width:510px;top:30px;bottom:0;z-index:2;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.s311 .lbl{font-size:28px;padding:3px 22px}
.s311 .date{margin-top:8px;gap:6px}
.s311 .date b{font-size:60px}
.s311 .date .w{width:30px;height:30px;font-size:17px}
.s311 .date .to{font-size:32px;margin:0 2px}
.s311 .times{display:flex;justify-content:space-between;width:100%;max-width:420px;margin-top:4px;padding:0 14px}
.s311 .times span{font-family:var(--num);font-weight:500;font-size:24px;color:var(--gold-l);letter-spacing:.04em}
.s311 .ttl{margin-top:8px;font-size:32px}
.s311 .tk{position:absolute;z-index:2;right:40px;top:calc(50% + 15px);transform:translateY(-50%);padding:18px 28px 16px}
.s311 .tk::before{inset:8px}
.s311 .tk__pre{font-size:25px}.s311 .tk__pre b{font-size:40px;margin:0 .06em;vertical-align:-.06em}
.s311 .tk__row{margin-top:6px}
.s311 .off{font-size:96px}
.s311 .tk__c{font-size:34px;margin-left:8px}

/* ===== 1200x1200 ===== */
.s1200{width:1200px;height:1200px}
.s1200 .photo{left:0;top:540px;width:1200px;height:672px;-webkit-mask:linear-gradient(transparent,#000 16%,#000 75%,transparent);mask:linear-gradient(transparent,#000 16%,#000 75%,transparent)}
.s1200 .lights{height:56px}
.s1200 .col{position:absolute;left:0;right:0;top:78px;z-index:2;display:flex;flex-direction:column;align-items:center;text-align:center}
.s1200 .lbl{font-size:46px;padding:6px 34px}
.s1200 .date{margin-top:20px;gap:10px}
.s1200 .date b{font-size:116px}
.s1200 .date .w{width:54px;height:54px;font-size:28px}
.s1200 .date .to{font-size:58px;margin:0 6px}
.s1200 .times{display:flex;justify-content:space-between;width:860px;margin-top:10px;padding:0 40px}
.s1200 .times span{font-family:var(--num);font-weight:500;font-size:38px;color:var(--gold-l);letter-spacing:.06em}
.s1200 .ttl{margin-top:26px;font-size:76px}
.s1200 .tk{position:absolute;z-index:2;left:50%;bottom:44px;transform:translateX(-50%);padding:26px 56px 24px}
.s1200 .tk::before{inset:11px}
.s1200 .tk__pre{font-size:38px}.s1200 .tk__pre b{font-size:60px;margin:0 .06em;vertical-align:-.06em}
.s1200 .tk__row{margin-top:8px}
.s1200 .off{font-size:150px}
.s1200 .tk__c{font-size:56px;margin-left:14px}
</style>
</head>
<body>
<div class="bn" id="bn">
  <img class="photo" id="photo" alt="">
  <svg class="lights" viewBox="0 0 1600 60" preserveAspectRatio="none" aria-hidden="true">
    <path d="M0 6 Q100 46 200 12 T400 12 T600 12 T800 12 T1000 12 T1200 12 T1400 12 T1600 6" fill="none" stroke="#3d4d72" stroke-width="2"/>
    <g id="bulbs"></g>
  </svg>
  <div class="col">
    <p class="lbl">7日間だけの期間限定</p>
    <p class="date"><b>11/24</b><i class="w">火</i><span class="to">〜</span><b>11/30</b><i class="w">月</i></p>
    <p class="times"><span>10:00から</span><span>23:59まで</span></p>
    <p class="ttl">1冊は<em>聖夜</em>に<span class="br"></span>1冊は<em>ご挨拶</em>に</p>
  </div>
  <div class="tk">
    <p class="tk__pre">ブック型ギフトを<b>2</b>セットで</p>
    <p class="tk__row"><span class="off"><b>1,000</b><span class="off__u"><i class="y">円</i><i class="o">OFF</i></span></span><span class="tk__c">クーポン</span></p>
  </div>
</div>
<script>
var s=(new URLSearchParams(location.search).get('s'))||'900';
var bn=document.getElementById('bn');bn.className='bn s'+s;
document.getElementById('photo').src='p'+s+'.jpg';
// 900と1200はタイトルを2行に、311は1行
var br=document.querySelector('.ttl .br');
if(s!=='311'){br.outerHTML='<br>'}else{br.outerHTML='&ensp;'}
// 1200と900はクーポン札をタイトル下(列の中)に置く
if(s==='900'){document.querySelector('.col').appendChild(document.querySelector('.tk'))}
// 電飾
var W=s==='1200'?1200:(s==='311'?Math.round(1600*60/40):1600),svg=document.querySelector('.lights'),cols=['#e0b860','#c8323e','#3d8c5c'],d='M0 6',h='';
svg.setAttribute('viewBox','0 0 '+W+' 60');svg.setAttribute('preserveAspectRatio','xMidYMin meet');
for(var x=0;x<W;x+=200)d+=' Q'+(x+100)+' 46 '+(x+200)+' 8';
svg.querySelector('path').setAttribute('d',d);
// 曲線上に電球を置く(二次ベジェの近似)
for(var x=40,i=0;x<W;x+=80,i++){var t=(x%200)/200,y=(1-t)*(1-t)*8+2*(1-t)*t*46+t*t*8;h+='<circle cx="'+x+'" cy="'+(y+9)+'" r="7" fill="'+cols[i%3]+'"/>'}
document.getElementById('bulbs').innerHTML=h;
</script>
</body>
</html>
